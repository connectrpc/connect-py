version: v2
plugins:
  - local: protoc-gen-py
    out: .
  - local: protoc-gen-connectrpc
    out: .
  # TODO: Consider extracting a testing package to share haberdasher among packages.
  - local: protoc-gen-py
    out: ../connectrpc-grpcreflect/test/
  - local: protoc-gen-connectrpc
    out: ../connectrpc-grpcreflect/test/

  # NOTE: v26.0 is the earliest version supporting protobuf==5.
  - remote: buf.build/protocolbuffers/python:v26.0
    out: google_compat
  - remote: buf.build/protocolbuffers/pyi:v26.0
    out: google_compat
  - local: protoc-gen-connectrpc
    out: google_compat
    opt: protobuf=google
