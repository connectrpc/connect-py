[project]
name = "example"
version = "0.1.0"
dependencies = [
  "connectrpc",
  "flask==3.1.3",
  "protobuf-py>=0.1.1",
  "starlette==1.3.1",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
extend = "../pyproject.toml"

[tool.uv.build-backend]
module-name = "example"
module-root = ""
