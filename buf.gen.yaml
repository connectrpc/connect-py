version: v2
inputs:
  - module: buf.build/googleapis/googleapis
    types:
      - google.rpc.Status
  - module: buf.build/grpc/grpc
    types:
      - grpc.reflection.v1.ServerReflection
      - grpc.reflection.v1alpha.ServerReflection
plugins:
  - local: protoc-gen-py
    out: src/connectrpc/_gen
  - local: protoc-gen-connectrpc
    out: src/connectrpc/_gen
