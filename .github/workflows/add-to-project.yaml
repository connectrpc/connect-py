name: Add issues and PRs to project

on:
  issues:
    types:
      - opened
      - reopened
      - transferred
  pull_request_target:
    types:
      - opened
      - reopened
  issue_comment:
    types:
      - created

# GitHub token created from secret so default token not used.
permissions: {}

jobs:
  call-workflow-add-to-project:
    name: Call workflow to add issue to project
    uses: connectrpc/base-workflows/.github/workflows/add-to-project.yaml@f80fdd301dc9faf6b94e16c616fcdfd2316f1af9 # main
    secrets: inherit
