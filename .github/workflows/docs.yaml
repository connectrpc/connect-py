name: Documentation
on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "src/**"
      - "connectrpc-grpchealth/**"
      - "connectrpc-grpcreflect/**"
      - "connectrpc-otel/**"
      - zensical.toml
      - ".github/workflows/docs.yaml"
  pull_request:
    paths:
      - "docs/**"
      - "src/**"
      - "connectrpc-grpchealth/**"
      - "connectrpc-grpcreflect/**"
      - "connectrpc-otel/**"
      - zensical.toml
      - ".github/workflows/docs.yaml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Use a constant key for commits so deployments are queued in order.
  # Cancel in-progress jobs for PRs only
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    environment:
      name: ${{ github.event_name != 'pull_request' && 'github-pages' || null }}
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - run: uv run poe docs-build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site

      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        if: github.event_name != 'pull_request'
        id: deployment
