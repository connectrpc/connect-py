name: Release connectrpc-grpchealth
on:
  push:
    tags:
      - "connectrpc-grpchealth/v*"
  workflow_dispatch:

permissions:
  id-token: write
  attestations: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-26.04
    environment: ${{ (github.event_name == 'workflow_dispatch' && 'pypi-test') || (github.event_name == 'push' && github.ref_type == 'tag' && 'pypi-release') || null }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3

      - name: check versions match the tag
        if: github.ref_type == 'tag'
        run: |
          for dir in connectrpc-grpchealth; do
            version="$(uv version --short --directory "$dir")"
            if [ "$version" != "${GITHUB_REF_NAME#connectrpc-grpchealth/v}" ]; then
              echo "::error::$dir is version $version, but the tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done

      - run: uv sync --frozen

      # Builds into root dist directory
      - run: uv build
        working-directory: connectrpc-grpchealth

      - name: publish connectrpc-grpchealth
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          repository-url: ${{ github.event_name == 'workflow_dispatch' && 'https://test.pypi.org/legacy/' || null }}
          skip-existing: true
